services:

  eureka-server:
    container_name: eureka-server
    build:
      context: ../services/eureka-server
      dockerfile: Dockerfile
    image: substrax/eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - substrax-network

  api-gateway:
    container_name: api-gateway
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    image: substrax/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - eureka-server
      - keycloak
    networks:
      - substrax-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak
    command: start-dev
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - substrax-network

networks:
  substrax-network:
    driver: bridge
