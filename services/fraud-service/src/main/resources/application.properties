# ===============================
# Server
# ===============================
server.port=8083
spring.application.name=fraud-service


# ===============================
# Redis (FIXED)
# ===============================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraud-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8085
spring.kafka.consumer.properties.specific.avro.reader=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8085
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.use.latest.version=true

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.kafka=INFO

# ===============================
# Observability (Tracing)
# ===============================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Ensure tracing is enabled
management.tracing.enabled=true

# Optional: Add trace IDs to your console logs to see them while debugging
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# Enable tracing for the Producer (Orchestrator)
spring.kafka.template.observation-enabled=true
# Enable tracing for the Consumer (Fraud Service)
spring.kafka.listener.observation-enabled=true


# ===============================
# Resilience4j - Retry
# ===============================
resilience4j.retry.instances.fraudService.maxAttempts=3
resilience4j.retry.instances.fraudService.waitDuration=2s
resilience4j.retry.instances.fraudService.retry-exceptions=\
java.net.ConnectException,\
org.springframework.data.redis.RedisConnectionFailureException,\
org.apache.kafka.common.errors.TimeoutException
resilience4j.retry.instances.fraudService.retryExceptions[0]=org.apache.kafka.common.errors.TimeoutException
resilience4j.retry.instances.fraudService.retryExceptions[1]=java.net.ConnectException

