# ===============================
# Server
# ===============================
server.port=8086
spring.application.name=notification-service

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://notification-db:5432/notificationdb
spring.datasource.username=notificationuser
spring.datasource.password=notificationpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Redis
# ===============================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.consumer.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.consumer.properties.specific.avro.reader=true

# 🔥 REQUIRED for tracing propagation
spring.kafka.listener.observation-enabled=true

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Observability (Zipkin / Tracing)
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# 🔥 REQUIRED
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Logging correlation
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate=OFF
logging.level.io.micrometer.tracing=INFO

# ===============================
# Security (Keycloak - Docker)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/substrax
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/substrax/protocol/openid-connect/certs
