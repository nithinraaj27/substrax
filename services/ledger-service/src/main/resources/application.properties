# ===============================
# Server
# ===============================
server.port=8084
spring.application.name=ledger-service

# ===============================
# Database (PostgreSQL - LOCAL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerdb
spring.datasource.username=ledgeruser
spring.datasource.password=ledgerpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Kafka (LOCAL)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true

# ===============================
# Eureka (LOCAL)
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Observability
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c,b3
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

spring.kafka.listener.observation-enabled=true

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=INFO

# ===============================
# Security (Keycloak - LOCAL)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/substrax
