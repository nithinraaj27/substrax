# ===============================
# Server
# ===============================
server.port=8084
spring.application.name=ledger-service

# ===============================
# Database (PostgreSQL - Docker)
# ===============================
spring.datasource.url=jdbc:postgresql://ledger-db:5432/ledgerdb
spring.datasource.username=ledgeruser
spring.datasource.password=ledgerpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Kafka (Docker)
# ===============================
spring.kafka.bootstrap-servers=kafka:9092

# ---- Consumer ----
spring.kafka.consumer.group-id=ledger-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.consumer.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.consumer.properties.specific.avro.reader=true

# ---- Producer (IMPORTANT for tracing) ----
spring.kafka.producer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

# ===============================
# Kafka Observability (CRITICAL)
# ===============================
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

# ===============================
# Eureka (Docker)
# ===============================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Observability / Tracing (Zipkin)
# ===============================
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# MDC logging (traceId / spanId)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.kafka.listener=INFO
logging.level.io.micrometer.tracing=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=OFF

# ===============================
# Security (Keycloak - Docker)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/substrax

# ===============================
# AWS S3 (Ledger Export)
# ===============================
aws.region=eu-north-1
aws.s3.bucket=substrax-ledger-bucket

ledger.export.s3.bucket=substrax-ledger-bucket
ledger.export.s3.prefix=ledger-events/
