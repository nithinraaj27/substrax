# ===============================
# Server
# ===============================
server.port=8082
spring.application.name=payment-orchestrator

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://payment-db:5432/paymentdb
spring.datasource.username=paymentuser
spring.datasource.password=paymentpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Redis
# ===============================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms


# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=payment-orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

spring.kafka.consumer.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.consumer.properties.specific.avro.reader=true

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Observability (Tracing)
# ===============================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Ensure tracing is enabled
management.tracing.enabled=true

# Optional: Add trace IDs to your console logs to see them while debugging
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# Enable tracing for the Producer (Orchestrator)
spring.kafka.template.observation-enabled=true
# Enable tracing for the Consumer (Fraud Service)
spring.kafka.listener.observation-enabled=true

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate= DEBUG


# ===============================
# Security (Keycloak - LOCAL)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/substrax

# ===============================
# Kafka (Schema Registry)
# ===============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

spring.kafka.producer.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.use.latest.version=true

# ===============================
# Resilience4j - Retry (Kafka Producer)
# ===============================
resilience4j.retry.instances.paymentProducer.maxAttempts=3
resilience4j.retry.instances.paymentProducer.waitDuration=2s

resilience4j.retry.instances.paymentProducer.retryExceptions[0]=org.apache.kafka.common.errors.TimeoutException
resilience4j.retry.instances.paymentProducer.retryExceptions[1]=org.apache.kafka.common.errors.NetworkException
resilience4j.retry.instances.paymentProducer.retryExceptions[2]=java.net.ConnectException

