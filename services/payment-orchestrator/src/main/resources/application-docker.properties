# ===============================
# Server
# ===============================
server.port=8082
spring.application.name=payment-orchestrator

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://payment-db:5432/paymentdb
spring.datasource.username=paymentuser
spring.datasource.password=paymentpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# Redis
# ===============================
spring.redis.host=redis
spring.redis.port=6379
spring.redis.timeout=5000ms
spring.data.redis.connect-timeout=5000ms


# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=payment-orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.acks=all

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# Observability
# ===============================
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,prometheus

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate= DEBUG


# ===============================
# Security (Keycloak - LOCAL)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/substrax

