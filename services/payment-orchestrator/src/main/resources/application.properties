# ===============================
# Server
# ===============================
server.port=8082
spring.application.name=payment-orchestrator

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=paymentuser
spring.datasource.password=paymentpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis
# ===============================
spring.redis.host=localhost
spring.redis.port=6379

# ===============================
# Kafka
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-orchestrator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ===============================
# Observability
# ===============================
management.tracing.sampling.probability=1.0

management.endpoints.web.exposure.include=health,info,prometheus

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.flywaydb=INFO

# ===============================
# Security (Keycloak - LOCAL)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/substrax